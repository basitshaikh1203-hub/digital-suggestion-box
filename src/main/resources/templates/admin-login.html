<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - CampusVoice</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f6f9;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 420px;
            background: white;
            border: 1px solid #dfe3e8;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand h1 {
            color: #17365d;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .brand p {
            color: #68717d;
            font-size: 14px;
        }

        .title {
            color: #252b33;
            font-size: 21px;
            margin-bottom: 25px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #343a40;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cfd5dc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #17365d;
        }

        .login-button {
            width: 100%;
            padding: 13px;
            background: #17365d;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .login-button:hover {
            background: #102a49;
        }

        .error {
            background: #fce8e8;
            border: 1px solid #e6b8b8;
            color: #a33a3a;
            padding: 11px 12px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #7a828c;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="brand">
        <h1>CampusVoice</h1>
        <p>Digital Suggestion Box</p>
    </div>

    <h2 class="title">Administrator Login</h2>

    <div th:if="${error}" class="error" th:text="${error}">
        Invalid username or password.
    </div>

    <form action="/admin/login" method="post">

        <div class="form-group">
            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter admin username"
                required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter admin password"
                required>
        </div>

        <button type="submit" class="login-button">
            Sign In
        </button>

    </form>

    <div class="footer">
        Campus Feedback System
    </div>

</div>

</body>

</html>
