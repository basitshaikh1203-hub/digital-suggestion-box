<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Track Suggestion - CampusVoice</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f7f7f7;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .container {
            width: 520px;
            background: white;
            border: 2px solid #5A0F1B;
            padding: 40px;
        }

        h1 {
            color: #5A0F1B;
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #5A0F1B;
            font-size: 15px;
            margin-bottom: 15px;
            outline: none;
        }

        input:focus {
            border-color: #430B14;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #5A0F1B;
            color: white;
            border: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 25px;
        }

        button:hover {
            background: #430B14;
        }

        .error {
            background: #fce8e8;
            border: 1px solid #c77;
            color: #8a1f1f;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .result {
            border: 1px solid #5A0F1B;
            padding: 22px;
            margin-top: 10px;
        }

        .result-title {
            color: #5A0F1B;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .row {
            border-bottom: 1px solid #ddd;
            padding: 12px 0;
        }

        .row:last-child {
            border-bottom: none;
        }

        .label {
            color: #777;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .value {
            color: #222;
            font-size: 15px;
        }

        .status {
            display: inline-block;
            padding: 7px 14px;
            background: #5A0F1B;
            color: white;
            font-size: 13px;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            color: #5A0F1B;
            text-decoration: none;
            font-size: 14px;
            margin-top: 25px;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Track Suggestion</h1>

    <p class="description">
        Enter the Tracking ID you received after submitting
        your suggestion to check its current status.
    </p>

    <form action="/track" method="post">

        <label for="trackingId">
            Tracking ID
        </label>

        <input
            type="text"
            id="trackingId"
            name="trackingId"
            placeholder="Example: CV-A1B2C3"
            required>

        <button type="submit">
            Check Status
        </button>

    </form>

    <div th:if="${error}" class="error" th:text="${error}">
        No suggestion found.
    </div>

    <div th:if="${suggestion}" class="result">

        <div class="result-title">
            Suggestion Details
        </div>

        <div class="row">

            <div class="label">
                TRACKING ID
            </div>

            <div class="value"
                 th:text="${suggestion.trackingId}">
                CV-A1B2C3
            </div>

        </div>

        <div class="row">

            <div class="label">
                CATEGORY
            </div>

            <div class="value"
                 th:text="${suggestion.category}">
                Infrastructure
            </div>

        </div>

        <div class="row">

            <div class="label">
                SUGGESTION
            </div>

            <div class="value"
                 th:text="${suggestion.suggestion}">
                Example suggestion
            </div>

        </div>

        <div class="row">

            <div class="label">
                STATUS
            </div>

            <div>
                <span class="status"
                      th:text="${suggestion.status}">
                    Pending
                </span>
            </div>

        </div>

    </div>

    <a href="/" class="back">
        ← Back to CampusVoice
    </a>

</div>

</body>

</html>
